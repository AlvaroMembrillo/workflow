# application-demo.yml — demostración autocontenida con docker-compose.demo.yml
# La base de datos se indica con SPRING_DATASOURCE_URL, _USERNAME y _PASSWORD.
app:
  legal:
    titular: Workflow (proyecto de demostración)
    nif: no aplica
    domicilio: no aplica
  admin:
    # Cuenta de moderación de la demo (ver README). En producción se indica con ADMIN_EMAIL y ADMIN_PASSWORD
    email: admin@demo.test
    password: demo-workflow
  limites:
    # Todo el que prueba la demo llega desde la misma IP (la de Docker), y los tests de extremo a
    # extremo crean decenas de cuentas por ejecución
    login-por-ip: { maximo: 1000, ventana: 15m }
    registro-por-ip: { maximo: 1000, ventana: 1h }
    correos-por-ip: { maximo: 1000, ventana: 1h }
  sesion:
    # La demo se abre en http://localhost:8000, sin HTTPS
    cookie-segura: false
  jwt:
    # La clave se genera la primera vez en un volumen de Docker. En producción se usaría una clave propia
    clave-privada: ${JWT_CLAVE_PRIVADA:/datos/jwt/clave-privada.pem}
    generar-clave-si-no-existe: true

server:
  # Detrás de nginx: las URL que genera la aplicación (por ejemplo, la de Swagger) usan el host público
  forward-headers-strategy: framework
