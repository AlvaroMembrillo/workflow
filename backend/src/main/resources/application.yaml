# application.yml — común
spring:
  application:
    name: portal-empleo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  profiles:
    active: dev
  data:
    web:
      pageable:
        max-page-size: 50
        # Páginas como {"content": [...], "page": {...}}, un formato estable para el frontend
        serialization-mode: via-dto

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: workflow-api
    duracion-token: 1h
    clave-privada: ${JWT_CLAVE_PRIVADA:}
  cors:
    origenes-permitidos: ${CORS_ORIGENES_PERMITIDOS:http://localhost:4200}