# application.yml — común
spring:
  application:
    name: portal-empleo
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  profiles:
    active: dev
  data:
    web:
      pageable:
        max-page-size: 50
        # Páginas como {"content": [...], "page": {...}}, un formato estable para el frontend
        serialization-mode: via-dto

  servlet:
    multipart:
      # Solo se suben currículos. Algo de margen sobre app.cv.tamano-maximo para las cabeceras de la petición
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    # Por defecto, Mailpit (docker compose): recoge los correos y los muestra en http://localhost:8025
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USUARIO:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTENTICACION:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  port: 8080

management:
  health:
    mail:
      # Si el servidor de correo no responde, la aplicación sigue funcionando: no debe darse por caída
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    issuer: workflow-api
    # Corto, porque un token de acceso no se puede revocar; la sesión se alarga con el token de refresco
    duracion-token: 15m
    clave-privada: ${JWT_CLAVE_PRIVADA:}
  sesion:
    # Días sin usar la web tras los que hay que volver a entrar
    duracion: 30d
    margen-de-reutilizacion: 10s
    cookie-segura: ${COOKIE_SEGURA:true}
  cors:
    origenes-permitidos: ${CORS_ORIGENES_PERMITIDOS:http://localhost:4200}
  # Frenos contra la fuerza bruta y el envío masivo de correos (ver LimitesProperties)
  limites:
    fallos-de-login: { maximo: 5, ventana: 15m }
    login-por-ip: { maximo: 50, ventana: 15m }
    registro-por-ip: { maximo: 10, ventana: 1h }
    correos-por-destinatario: { maximo: 3, ventana: 1h }
    correos-por-ip: { maximo: 10, ventana: 1h }
  correo:
    remitente: ${CORREO_REMITENTE:Workflow <no-responder@workflow.localhost>}
    # Dirección de la web, para los enlaces de los correos
    url-publica: ${URL_PUBLICA:http://localhost:4200}
    # Quien atiende el portal: recibe las denuncias y se da como contacto
    contacto: ${CORREO_CONTACTO:soporte@workflow.localhost}
  admin:
    # Si se indican, al arrancar se crea esta cuenta de administrador (si no existe ya)
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  enlaces:
    validez-verificacion: 48h
    validez-restablecimiento: 1h
  cv:
    tamano-maximo: 5MB
  ofertas:
    cierre-automatico:
      inactividad: 60d
      cron: "0 0 3 * * *"