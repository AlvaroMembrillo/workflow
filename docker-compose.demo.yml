# Demostración completa en un solo comando:
#   docker compose -f docker-compose.demo.yml up --build
# y abrir http://localhost:8000. Carga datos de ejemplo (ver README).
# Es independiente del docker-compose.yml de desarrollo: usa su propia base de datos y no ocupa el puerto 5432.
name: workflow-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portal_empleo
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    volumes:
      - postgres-demo:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_empleo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portal_empleo
      SPRING_DATASOURCE_USERNAME: portal
      SPRING_DATASOURCE_PASSWORD: portal
    volumes:
      - jwt-demo:/datos/jwt
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # La imagen del JRE no trae curl: se consulta /actuator/health con bash
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-demo:
  jwt-demo:
