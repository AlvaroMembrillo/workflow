services:
  postgres:
    image: postgres:17-alpine
    container_name: workflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal_empleo
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_empleo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor de correo de desarrollo: recoge lo que envía la aplicación y lo muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: workflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
