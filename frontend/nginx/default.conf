# Sirve la aplicación Angular y reenvía la API al backend. Web y API comparten origen, así que no hace
# falta CORS y el navegador envía las peticiones a la API como a cualquier otra ruta de la web.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://backend:8080;
        # El host con el puerto que ve el navegador (localhost:8000). Con $host y $server_port, Spring
        # creería que la web está en localhost:80 y rechazaría por CORS los POST, que llevan Origin
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Documentación de la API (Swagger UI). Trae su propio JavaScript, así que no lleva la CSP de la web
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ficheros con el hash del contenido en el nombre: se pueden guardar en caché para siempre
    location ~* \.(?:js|css|woff2)$ {
        include /etc/nginx/conf.d/cabeceras-seguridad.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Cualquier otra ruta es de la aplicación: el router de Angular decide qué mostrar
    location / {
        include /etc/nginx/conf.d/cabeceras-seguridad.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
